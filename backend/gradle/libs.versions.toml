[versions]
# Coverage (DEVELOPMENT_PLAN.md §3); 0.8.14 is the first release that reads Java 25 class files.
jacoco = "0.8.14"
java = "25"
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
# Versions below are aligned with the Spring Boot 4.1.1 BOM; they are pinned here because the
# build script's jOOQ code generation runs outside the Spring BOM (buildscript classpath).
jooq = "3.21.7"
flyway = "12.4.0"
postgresql = "42.7.13"
testcontainers = "2.0.5"
archunit = "1.5.1"
spotless = "8.10.3"
palantir-java-format = "2.101.0"
bouncycastle = "1.86"
db-scheduler = "16.12.0"
postgres-image = "postgres:18.6"
# Security overrides of versions managed by the Spring Boot BOM. Remove once the BOM ships these or newer.
#   tomcat 11.0.24: CVE-2026-65182, CVE-2026-65905, CVE-2026-68525 (CRITICAL)
#   jackson 3.1.5:  CVE-2026-89407, CVE-2026-89425, CVE-2026-68497, CVE-2026-91776, CVE-2026-91777 (HIGH)
tomcat = "11.0.26"
jackson = "3.1.7"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }

spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
jooq-postgres-extensions = { module = "org.jooq:jooq-postgres-extensions", version.ref = "jooq" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
db-scheduler-starter = { module = "com.github.kagkarlsson:db-scheduler-spring-boot-4-starter", version.ref = "db-scheduler" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-modulith-api = { module = "org.springframework.modulith:spring-modulith-api" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
spring-modulith-docs = { module = "org.springframework.modulith:spring-modulith-docs" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# Build-time only (jOOQ code generation against a throwaway PostgreSQL container)
codegen-jooq = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
codegen-jooq-postgres-extensions = { module = "org.jooq:jooq-postgres-extensions", version.ref = "jooq" }
codegen-flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
codegen-flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
codegen-postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
codegen-testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
