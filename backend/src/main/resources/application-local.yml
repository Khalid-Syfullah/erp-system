# Local development (`./gradlew bootRun`). Reads the repository's .env so that the backend and
# docker compose share one set of local credentials. Never use this profile outside a workstation.
spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${ERP_DB_URL:jdbc:postgresql://localhost:5432/erp}
  flyway:
    enabled: ${ERP_DB_MIGRATE_ON_STARTUP:true}
  mail:
    # Mailpit from infra/compose (web UI on http://localhost:8025).
    host: ${ERP_MAIL_HOST:localhost}
    port: ${ERP_MAIL_PORT:1025}
    properties:
      mail.smtp.starttls.enable: false

logging:
  # Human-readable console output locally (logback-spring.xml); still redacted.
  pattern:
    level: "%5p [%X{request_id:-}]"

erp:
  files:
    # The S3 gateway from infra/compose (SeaweedFS, authentication off locally).
    bucket: ${ERP_FILES_BUCKET:erp-files}
    endpoint: ${ERP_FILES_ENDPOINT:http://localhost:8333}
    access-key: ${ERP_FILES_ACCESS_KEY:local}
    secret-key: ${ERP_FILES_SECRET_KEY:local}
    path-style: true
    create-bucket: true
  security:
    secure-cookies: false
    allowed-origins: ${ERP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  auth:
    public-base-url: ${ERP_AUTH_PUBLIC_BASE_URL:http://localhost:5173}

db-scheduler:
  enabled: ${ERP_JOBS_ENABLED:true}
