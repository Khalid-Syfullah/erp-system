# Base configuration shared by every profile. Environment variables (ERP_*) override defaults;
# secrets have NO defaults here. Startup fails fast with the list of missing variables
# (RequiredConfigurationValidator). Profiles: local | test | prod (+ migrate).
spring:
  application:
    name: erp-backend
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ERP_DB_URL:}
    username: ${ERP_DB_APP_USER:erp_app}
    password: ${ERP_DB_APP_PASSWORD:}
    hikari:
      pool-name: erp-app
      maximum-pool-size: ${ERP_DB_POOL_SIZE:10}
      minimum-idle: ${ERP_DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000 # ms
      validation-timeout: 3000 # ms
      max-lifetime: 1800000 # ms (30 min)
      # Fail at startup when the database is unreachable instead of serving errors later.
      initialization-fail-timeout: 30000 # ms
      data-source-properties:
        ApplicationName: erp-backend
        tcpKeepAlive: true
        # Server-side guards (ARCHITECTURE.md §6.2): runaway statements, lock waits, idle transactions.
        options: "-c statement_timeout=${ERP_DB_STATEMENT_TIMEOUT:30s} -c lock_timeout=${ERP_DB_LOCK_TIMEOUT:5s} -c idle_in_transaction_session_timeout=60s"
  flyway:
    enabled: ${ERP_DB_MIGRATE_ON_STARTUP:false}
    url: ${spring.datasource.url}
    user: ${ERP_DB_MIGRATOR_USER:erp_migrator}
    password: ${ERP_DB_MIGRATOR_PASSWORD:}
    # Objects are created as erp_owner, never as the login role (DATABASE.md §2.7).
    init-sqls: SET ROLE erp_owner
    schemas: platform
    default-schema: platform
    table: flyway_schema_history
    locations: classpath:db/migration
    placeholder-replacement: false
    validate-migration-naming: true
    clean-disabled: true
    connect-retries: 10
  jooq:
    sql-dialect: postgres
  mail:
    host: ${ERP_MAIL_HOST:}
    port: ${ERP_MAIL_PORT:587}
    username: ${ERP_MAIL_USERNAME:}
    password: ${ERP_MAIL_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${ERP_MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  mvc:
    problemdetails:
      enabled: false
  web:
    locale: en
    locale-resolver: fixed
  servlet:
    multipart:
      # Uploads are checked again by the file service (erp.files.max-size).
      max-file-size: 25MB
      max-request-size: 26MB
    resources:
      add-mappings: false

server:
  port: ${ERP_HTTP_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

# OpenAPI (ADR-035): generated by OpenApiContractTest into build/openapi/openapi.json, never served.
springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/**
  default-produces-media-type: application/json

management:
  server:
    port: ${ERP_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  info:
    env:
      enabled: false
  health:
    # Mail delivery is asynchronous and retried by users; an SMTP outage must not mark the service down.
    mail:
      enabled: false

logging:
  structured:
    format:
      console: ecs
    json:
      customizer: com.erp.platform.logging.RedactingJsonMembersCustomizer
    ecs:
      service:
        name: erp-backend
  level:
    root: INFO
    # 404s are already in the access log; avoid one WARN per probe of an unknown path.
    org.springframework.web.servlet.PageNotFound: ERROR

erp:
  # Object storage for documents and generated PDFs (ARCHITECTURE.md §8.6). AWS S3 in production
  # (credentials from the default chain, SSE-KMS); MinIO locally and in tests.
  files:
    bucket: ${ERP_FILES_BUCKET:}
    region: ${ERP_FILES_REGION:us-east-1}
    endpoint: ${ERP_FILES_ENDPOINT:}
    access-key: ${ERP_FILES_ACCESS_KEY:}
    secret-key: ${ERP_FILES_SECRET_KEY:}
    path-style: ${ERP_FILES_PATH_STYLE:false}
    max-size: 25MB
  api:
    cursor-signing-key: ${ERP_API_CURSOR_SIGNING_KEY:}
    max-request-body-size: 1MB
  security:
    secure-cookies: true
    # Exact origins of the web application, comma-separated (required in production).
    allowed-origins: ${ERP_SECURITY_ALLOWED_ORIGINS:}
    rate-limits:
      enabled: true
      session-per-minute: 600
      token-per-minute: 1200
      anonymous-per-minute: 300
  crypto:
    # <version>:<base64 32-byte key>[,...]; highest version encrypts (required in production).
    field-encryption-keys: ${ERP_FIELD_ENCRYPTION_KEYS:}
  auth:
    # Base URL of the web application for invitation and reset links (required in production).
    public-base-url: ${ERP_AUTH_PUBLIC_BASE_URL:}
    mail-from: ${ERP_MAIL_FROM:no-reply@erp.invalid}
    permission-cache-ttl: 60s
    session:
      idle-timeout: 30m
      absolute-timeout: 12h
      max-concurrent: 5
    login:
      max-consecutive-failures: 5
      lockout-duration: 15m
      lockouts-before-admin-unlock: 3
      per-account-per-minute: 5
      per-ip-per-minute: 20
      attempt-retention: 90d
    tokens:
      invitation-ttl: 72h
      password-reset-ttl: 30m
      reset-requests-per-email-per-hour: 3
      reset-requests-per-ip-per-hour: 10
      redemptions-per-ip-per-hour: 10
      api-token-default-days: 90
      api-token-max-days: 365
    mfa:
      issuer: ${ERP_MFA_ISSUER:ERP}
      challenge-ttl: 5m
    bootstrap:
      admin-email: ${ERP_BOOTSTRAP_ADMIN_EMAIL:}
      admin-password: ${ERP_BOOTSTRAP_ADMIN_PASSWORD:}
      admin-display-name: ${ERP_BOOTSTRAP_ADMIN_DISPLAY_NAME:}

# Recurring maintenance jobs (purges, audit partitions). Enabled on the worker only
# (ERP_JOBS_ENABLED=true); API instances leave it off.
db-scheduler:
  enabled: ${ERP_JOBS_ENABLED:false}
  table-name: platform.scheduled_tasks
  threads: 2
  polling-interval: 30s
